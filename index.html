<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticity Check</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('https://images.unsplash.com/photo-1518495973542-4542c06a5843') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* Initial Loading Screen */
        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .loading-text {
            font-size: 15px;
            letter-spacing: 2px;
            font-weight: 500;
            text-transform: uppercase;
        }

        /* Main Verified Screen */
        #main-screen {
            display: none;
            max-width: 340px;
            padding: 20px;
            z-index: 5;
        }
        h1 {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 25px;
            line-height: 1.4;
            letter-spacing: -0.2px;
        }
        p {
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
            color: #dfdfdf;
        }
        .btn-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 35px;
        }
        .btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 0;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            width: 110px;
            border-radius: 2px;
            transition: background 0.2s;
        }
        .btn:active {
            background-color: #cccccc;
        }
        .item-info {
            font-size: 13px;
            color: #cccccc;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Step 1: Loading sequence -->
    <div id="loading-screen">
        <div class="loading-text">Checking Authenticity</div>
    </div>

    <!-- Step 2: Exact matching result screen -->
    <div id="main-screen">
        <h1>Good news! Your item is 100% authentic.</h1>
        <p>Would you like to register your product so we can track and streamline future warranty claims?</p>
        
        <div class="btn-container">
            <button class="btn" onclick="handleChoice('yes')">YES</button>
            <button class="btn" onclick="handleChoice('no')">NO</button>
        </div>

        <div class="item-info" onclick="toggleInfo()">
            Item information ▼
        </div>
    </div>

    <script>
        // Transition from checking screen to success screen after 2 seconds
        setTimeout(() => {
            const loadingScreen = document.getElementById('loading-screen');
            const mainScreen = document.getElementById('main-screen');
            
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                mainScreen.style.display = 'block';
            }, 500);
        }, 2000);

        function handleChoice(choice) {
            if (choice === 'yes') {
                alert("Thank you for registering!");
            } else {
                alert("Session complete.");
            }
        }

        function toggleInfo() {
            alert("Item Status: Verified Authentic");
        }
    </script>

</body>
</html>
