<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Authenticity Verification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
        }

        /* ---------------------------------- */
        /* PART 1: CHECKING AUTHENTICITY VIEW */
        /* ---------------------------------- */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111111 radial-gradient(circle, #2a2a2a 0%, #0d0d0d 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: opacity 0.6s ease;
        }

        /* Exact Double-Ring Badge Graphic */
        .badge-icon {
            width: 110px;
            height: 110px;
            margin-bottom: 25px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140"><path d="M42 15 C20 15 10 38 10 58 C10 82 28 100 45 130 C62 100 80 82 80 58 C80 38 70 15 42 15 Z" fill="%23e8e8e8"/><circle cx="45" cy="52" r="13" fill="%23111111"/><circle cx="45" cy="98" r="5" fill="%23111111"/><circle cx="20" cy="52" r="4" fill="%23111111"/><path d="M98 15 C76 15 66 38 66 58 C66 82 84 100 101 130 C118 100 136 82 136 58 C136 38 126 15 98 15 Z" fill="%23e8e8e8"/><circle cx="101" cy="52" r="13" fill="%23111111"/><circle cx="101" cy="98" r="5" fill="%23111111"/><circle cx="126" cy="52" r="4" fill="%23111111"/></svg>') no-repeat center;
            background-size: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(0.98); opacity: 0.85; }
            100% { transform: scale(1.02); opacity: 1; }
        }

        .checking-text {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #ffffff;
            text-align: center;
        }

        .screen-footer {
            position: absolute;
            bottom: 35px;
            font-size: 13.5px;
            color: #999999;
            letter-spacing: 0.5px;
        }

        /* ---------------------------------- */
        /* PART 2: SUCCESS SCREEN VIEW        */
        /* ---------------------------------- */
        .bg-success {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), 
                        url('https://images.unsplash.com/photo-1511497584788-876761c11969?auto=format&fit=crop&w=1200&q=80') no-repeat center center;
            background-size: cover;
            display: none;
            z-index: 1;
        }

        #main-screen {
            display: none;
            position: relative;
            z-index: 2;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 30px;
            text-align: center;
            color: #ffffff;
        }

        h1 {
            font-size: 21px;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 24px;
            max-width: 310px;
            letter-spacing: -0.2px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }

        p {
            font-size: 14px;
            font-weight: 400;
            line-height: 1.45;
            color: #e4e4e4;
            margin-bottom: 32px;
            max-width: 295px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .button-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            width: 100%;
            max-width: 290px;
            margin-bottom: 38px;
        }

        .btn {
            flex: 1;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 0;
            font-size: 13.5px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 2px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn:active {
            background-color: #cccccc;
        }

        .info-toggle {
            font-size: 13px;
            color: #d1d1d1;
            cursor: pointer;
            letter-spacing: 0.5px;
            user-select: none;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .info-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, margin-top 0.3s ease;
            font-size: 12px;
            color: #cccccc;
            line-height: 1.6;
        }

        .info-details.open {
            max-height: 80px;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <!-- Loading Screen (Phase 1) -->
    <div id="loading-screen">
        <div class="badge-icon"></div>
        <div class="checking-text">Checking Authenticity</div>
        <div class="screen-footer">mooseknuckles.io</div>
    </div>

    <!-- Success Background & Screen (Phase 2) -->
    <div class="bg-success" id="bg-success"></div>

    <div id="main-screen">
        <h1>Good news! Your item is 100% authentic.</h1>
        
        <p>Would you like to register your product so we can track and streamline future warranty claims?</p>

        <div class="button-group">
            <button class="btn" onclick="handleResponse('yes')">YES</button>
            <button class="btn" onclick="handleResponse('no')">NO</button>
        </div>

        <div class="info-toggle" onclick="toggleDetails()">
            Item information <span id="arrow">▼</span>
        </div>

        <div class="info-details" id="details">
            <p style="margin-bottom:0; font-size:12px; color:#cccccc;">
                STATUS: VERIFIED AUTHENTIC<br>
                CHECK TYPE: NFC HARDWARE PASS
            </p>
        </div>
    </div>

    <div class="screen-footer" id="footer-success" style="display: none;">mooseknuckles.io</div>

    <script>
        // Transition after 2.5 seconds to match video pacing
        setTimeout(() => {
            const loadingScreen = document.getElementById('loading-screen');
            const mainScreen = document.getElementById('main-screen');
            const bgSuccess = document.getElementById('bg-success');
            const footerSuccess = document.getElementById('footer-success');
            
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                bgSuccess.style.display = 'block';
                mainScreen.style.display = 'flex';
                footerSuccess.style.display = 'block';
            }, 500);
        }, 2500);

        function toggleDetails() {
            const details = document.getElementById('details');
            const arrow = document.getElementById('arrow');
            if (details.classList.contains('open')) {
                details.classList.remove('open');
                arrow.textContent = '▼';
            } else {
                details.classList.add('open');
                arrow.textContent = '▲';
            }
        }

        function handleResponse(choice) {
            if(choice === 'yes') {
                alert("Warranty registration initiated.");
            } else {
                alert("Thank you. Session finalized.");
            }
        }
    </script>

</body>
</html>
