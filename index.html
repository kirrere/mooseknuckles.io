<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Authenticity Verification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
        }

        /* 1. Loading Screen (Black background with logo, text, and URL footer) */
        #loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 10;
            transition: opacity 0.6s ease;
        }

        .loading-logo {
            width: 90px;
            height: 90px;
            margin-bottom: 24px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="white"><path d="M40 10 C20 10 10 30 10 45 C10 65 25 80 40 110 C55 80 70 65 70 45 C70 30 60 10 40 10 Z M35 30 A12 12 0 1 1 35 54 A12 12 0 0 1 35 30 Z" transform="translate(10, 0)"/><path d="M80 10 C60 10 50 30 50 45 C50 65 65 80 80 110 C95 80 110 65 110 45 C110 30 100 10 80 10 Z M75 30 A12 12 0 1 1 75 54 A12 12 0 0 1 75 30 Z" transform="translate(-10, 0)"/></svg>') no-repeat center;
            background-size: contain;
            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .loading-text {
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: 500;
            text-transform: uppercase;
            color: #ffffff;
        }

        .loading-footer {
            position: absolute;
            bottom: 35px;
            font-size: 13px;
            color: #888888;
            letter-spacing: 0.5px;
        }

        /* 2. Success Screen Background */
        .bg-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1511497584788-876761c11969?auto=format&fit=crop&w=1200&q=80') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* Main Content Screen */
        #main-screen {
            display: none;
            position: relative;
            z-index: 2;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 28px;
            text-align: center;
            color: #ffffff;
        }

        h1 {
            font-size: 21px;
            font-weight: 600;
            line-height: 1.35;
            margin-bottom: 22px;
            max-width: 300px;
            letter-spacing: -0.2px;
        }

        p {
            font-size: 14px;
            font-weight: 400;
            line-height: 1.45;
            color: #dedede;
            margin-bottom: 32px;
            max-width: 290px;
        }

        /* White Square Buttons */
        .button-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            width: 100%;
            max-width: 290px;
            margin-bottom: 35px;
        }

        .btn {
            flex: 1;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 12px 0;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 1px;
        }

        .btn:active {
            background-color: #cccccc;
        }

        /* Expandable Item Info */
        .info-toggle {
            font-size: 13px;
            color: #cccccc;
            cursor: pointer;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .info-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, margin-top 0.3s ease;
            font-size: 12px;
            color: #cccccc;
            line-height: 1.6;
        }

        .info-details.open {
            max-height: 80px;
            margin-top: 12px;
        }

        /* Bottom Footer for Success Screen */
        .screen-footer {
            position: absolute;
            bottom: 35px;
            font-size: 13px;
            color: #888888;
            letter-spacing: 0.5px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- Step 1: Loading Screen Sequence matching video -->
    <div id="loading-screen">
        <div class="loading-logo"></div>
        <div class="loading-text">Checking Authenticity</div>
        <div class="loading-footer">mooseknuckles.io</div>
    </div>

    <!-- Step 2: Final Success Screen matching screenshot -->
    <div class="bg-container" id="bg-success" style="display: none;"></div>

    <div id="main-screen">
        <h1>Good news! Your item is 100% authentic.</h1>
        
        <p>Would you like to register your product so we can track and streamline future warranty claims?</p>

        <div class="button-group">
            <button class="btn" onclick="handleResponse('yes')">YES</button>
            <button class="btn" onclick="handleResponse('no')">NO</button>
        </div>

        <div class="info-toggle" onclick="toggleDetails()">
            Item information <span id="arrow">▼</span>
        </div>

        <div class="info-details" id="details">
            <p style="margin-bottom:0; font-size:12px; color:#cccccc;">
                STATUS: VERIFIED AUTHENTIC<br>
                CHECK TYPE: NFC HARDWARE PASS
            </p>
        </div>
    </div>

    <div class="screen-footer" id="footer-success" style="display: none;">mooseknuckles.io</div>

    <script>
        // Transition from loading screen to success screen after 2.2 seconds
        setTimeout(() => {
            const loadingScreen = document.getElementById('loading-screen');
            const mainScreen = document.getElementById('main-screen');
            const bgSuccess = document.getElementById('bg-success');
            const footerSuccess = document.getElementById('footer-success');
            
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
                bgSuccess.style.display = 'block';
                mainScreen.style.display = 'flex';
                footerSuccess.style.display = 'block';
            }, 500);
        }, 2200);

        function toggleDetails() {
            const details = document.getElementById('details');
            const arrow = document.getElementById('arrow');
            if (details.classList.contains('open')) {
                details.classList.remove('open');
                arrow.textContent = '▼';
            } else {
                details.classList.add('open');
                arrow.textContent = '▲';
            }
        }

        function handleResponse(choice) {
            if(choice === 'yes') {
                alert("Warranty registration initiated.");
            } else {
                alert("Thank you. Session finalized.");
            }
        }
    </script>

</body>
</html>
